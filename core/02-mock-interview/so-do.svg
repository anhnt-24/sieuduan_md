<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" width="1600" height="860" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A44"/></marker>
    <marker id="arP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6C5CE7"/></marker>
    <marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E9F8E"/></marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8891C"/></marker>
  </defs>
  <rect width="1600" height="860" fill="#fff"/>

  <!-- Tiêu đề -->
  <text x="20" y="34" font-size="22" font-weight="700" fill="#1F2A44">Lõi 2 — Phỏng vấn thử với AI: pipeline một lượt hỏi đáp và vòng phản hồi về roadmap</text>
  <text x="20" y="58" font-size="14" fill="#6B7280">Một lượt = ghi âm → STT → chấm STAR theo rubric → quyết định hỏi thêm / câu tiếp → TTS → phát lại. Ngân sách độ trễ: p50 ≈ 3,9 s · p95 ≈ 8,1 s (mục tiêu &lt; 8 s).</text>

  <!-- Vòng lặp lượt tiếp theo (nét đứt, phía trên) -->
  <path d="M1505,130 L1505,88 L105,88 L105,130" fill="none" stroke="#E8891C" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arO)"/>
  <text x="805" y="82" font-size="14" fill="#E8891C" text-anchor="middle">lượt tiếp theo — follow_up: cùng câu, fu_count + 1 (tối đa 2) · next: câu tiếp, qi + 1</text>

  <!-- 1. FE Ghi âm -->
  <rect x="20" y="130" width="170" height="120" rx="12" fill="#FFF4E8" stroke="#E8891C" stroke-width="2"/>
  <text x="105" y="155" font-size="16" font-weight="700" fill="#1F2A44" text-anchor="middle">1. Ghi âm [FE]</text>
  <text x="105" y="178" font-size="14" fill="#1F2A44" text-anchor="middle">MediaRecorder</text>
  <text x="105" y="196" font-size="14" fill="#1F2A44" text-anchor="middle">WebM/Opus, 10–40 s</text>
  <text x="105" y="214" font-size="14" fill="#1F2A44" text-anchor="middle">upload → BE</text>
  <text x="105" y="238" font-size="14" fill="#6B7280" text-anchor="middle">≈ 0,3 s</text>

  <path d="M190,190 L210,190" stroke="#1F2A44" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 2. STT -->
  <rect x="212" y="130" width="170" height="120" rx="12" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="297" y="155" font-size="16" font-weight="700" fill="#1F2A44" text-anchor="middle">2. STT</text>
  <text x="297" y="178" font-size="14" fill="#1F2A44" text-anchor="middle">Whisper large-v3 (Groq)</text>
  <text x="297" y="196" font-size="14" fill="#1F2A44" text-anchor="middle">+ prompt từ vựng kỹ thuật</text>
  <text x="297" y="214" font-size="14" fill="#1F2A44" text-anchor="middle">→ transcript (sửa được)</text>
  <text x="297" y="238" font-size="14" fill="#6B7280" text-anchor="middle">≈ 0,9 s</text>

  <path d="M382,190 L402,190" stroke="#1F2A44" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 3. Bộ chấm (2 làn) -->
  <rect x="404" y="100" width="620" height="290" rx="12" fill="#F6F4FF" stroke="#6C5CE7" stroke-width="2"/>
  <text x="714" y="124" font-size="16" font-weight="700" fill="#6C5CE7" text-anchor="middle">3. Bộ chấm — hai hướng, một hợp đồng JSON</text>

  <rect x="418" y="140" width="270" height="108" rx="12" fill="#fff" stroke="#6C5CE7" stroke-width="1.5"/>
  <text x="553" y="162" font-size="15" font-weight="700" fill="#6C5CE7" text-anchor="middle">Hướng A · LLM chấm theo rubric</text>
  <text x="430" y="184" font-size="14" fill="#1F2A44">Claude Sonnet 5, temperature 0, 1 call</text>
  <text x="430" y="202" font-size="14" fill="#1F2A44">rubric anchor 1/3/5 · evidence verbatim</text>
  <text x="430" y="220" font-size="14" fill="#1F2A44">&lt;candidate_answer&gt;…&lt;/candidate_answer&gt;</text>
  <text x="430" y="238" font-size="14" fill="#6B7280">≈ 1,8 s · ~$0,01 · JSON schema ép cứng</text>

  <rect x="418" y="264" width="270" height="108" rx="12" fill="#fff" stroke="#1F2A44" stroke-width="1.5"/>
  <text x="553" y="286" font-size="15" font-weight="700" fill="#1F2A44" text-anchor="middle">Hướng B · chấm theo quy tắc</text>
  <text x="430" y="308" font-size="14" fill="#1F2A44">S: cụm bối cảnh + độ dài L</text>
  <text x="430" y="326" font-size="14" fill="#1F2A44">T: cụm mục tiêu + L · A: 1 + số từ khóa</text>
  <text x="430" y="344" font-size="14" fill="#1F2A44">R: có số + từ kết quả → 5 · nhân hệ số độ khó</text>
  <text x="430" y="362" font-size="14" fill="#6B7280">&lt; 1 ms · tất định · fallback khi LLM lỗi</text>

  <path d="M688,194 L740,194 L740,230 L758,230" fill="none" stroke="#6C5CE7" stroke-width="2" marker-end="url(#arP)"/>
  <path d="M688,318 L740,318 L740,282 L758,282" fill="none" stroke="#1F2A44" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="760" y="140" width="250" height="232" rx="12" fill="#1F2A44"/>
  <text x="885" y="163" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Hợp đồng JSON (điểm chung)</text>
  <text x="772" y="187" font-size="14" fill="#E5E7EB" font-family="Menlo, Consolas, monospace">scores: {S,T,A,R} ∈ 0..5</text>
  <text x="772" y="207" font-size="14" fill="#E5E7EB" font-family="Menlo, Consolas, monospace">evidence: trích nguyên văn</text>
  <text x="772" y="227" font-size="14" fill="#E5E7EB" font-family="Menlo, Consolas, monospace">missing_points: []</text>
  <text x="772" y="247" font-size="14" fill="#E5E7EB" font-family="Menlo, Consolas, monospace">decision: follow_up | next</text>
  <text x="772" y="267" font-size="14" fill="#E5E7EB" font-family="Menlo, Consolas, monospace">follow_up_question: "…"</text>
  <text x="772" y="287" font-size="14" fill="#E5E7EB" font-family="Menlo, Consolas, monospace">confidence: 0..1</text>
  <line x1="772" y1="300" x2="998" y2="300" stroke="#6B7280"/>
  <text x="772" y="320" font-size="14" fill="#FDE68A">Server validate: miền 0–5, enum,</text>
  <text x="772" y="338" font-size="14" fill="#FDE68A">evidence là chuỗi con, parse lỗi 2 lần</text>
  <text x="772" y="356" font-size="14" fill="#FDE68A">→ rơi về Hướng B</text>

  <path d="M1024,245 L1046,245" stroke="#1F2A44" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 4. Quyết định -->
  <rect x="1048" y="150" width="190" height="190" rx="12" fill="#FFF8E6" stroke="#E8A81C" stroke-width="2"/>
  <text x="1143" y="174" font-size="16" font-weight="700" fill="#1F2A44" text-anchor="middle">4. Quyết định [BE]</text>
  <text x="1143" y="198" font-size="14" fill="#1F2A44" text-anchor="middle">fu_count ≥ 2 → ép next</text>
  <text x="1143" y="216" font-size="14" fill="#1F2A44" text-anchor="middle">(không tin LLM tự dừng)</text>
  <line x1="1062" y1="228" x2="1224" y2="228" stroke="#E8A81C"/>
  <text x="1143" y="248" font-size="14" fill="#D97706" text-anchor="middle" font-weight="700">follow_up</text>
  <text x="1143" y="266" font-size="14" fill="#1F2A44" text-anchor="middle">hỏi thêm cùng câu</text>
  <text x="1143" y="290" font-size="14" fill="#2EA05C" text-anchor="middle" font-weight="700">next</text>
  <text x="1143" y="308" font-size="14" fill="#1F2A44" text-anchor="middle">qi + 1, hết 3 câu → kết thúc</text>
  <text x="1143" y="330" font-size="14" fill="#6B7280" text-anchor="middle">≈ 0 s</text>

  <path d="M1238,245 L1258,245" stroke="#1F2A44" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 5. TTS -->
  <rect x="1260" y="150" width="150" height="120" rx="12" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="1335" y="175" font-size="16" font-weight="700" fill="#1F2A44" text-anchor="middle">5. TTS</text>
  <text x="1335" y="198" font-size="14" fill="#1F2A44" text-anchor="middle">edge-tts</text>
  <text x="1335" y="216" font-size="14" fill="#1F2A44" text-anchor="middle">vi-VN-HoaiMyNeural</text>
  <text x="1335" y="234" font-size="14" fill="#1F2A44" text-anchor="middle">→ mp3 url</text>
  <text x="1335" y="258" font-size="14" fill="#6B7280" text-anchor="middle">≈ 0,9 s</text>

  <path d="M1410,210 L1430,210" stroke="#1F2A44" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 6. FE phát -->
  <rect x="1432" y="150" width="148" height="120" rx="12" fill="#FFF4E8" stroke="#E8891C" stroke-width="2"/>
  <text x="1506" y="175" font-size="16" font-weight="700" fill="#1F2A44" text-anchor="middle">6. Phát lại [FE]</text>
  <text x="1506" y="198" font-size="14" fill="#1F2A44" text-anchor="middle">audio + văn bản</text>
  <text x="1506" y="216" font-size="14" fill="#1F2A44" text-anchor="middle">WebSocket push</text>
  <text x="1506" y="234" font-size="14" fill="#1F2A44" text-anchor="middle">"turn.scored"</text>
  <text x="1506" y="258" font-size="14" fill="#6B7280" text-anchor="middle">đo độ trễ trả lời</text>
  <path d="M1506,150 L1506,130" stroke="#E8891C" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Mũi tên xuống Kết thúc buổi -->
  <path d="M1143,340 L1143,400 L170,400 L170,440" fill="none" stroke="#1F2A44" stroke-width="2" marker-end="url(#ar)"/>
  <text x="660" y="415" font-size="14" fill="#1F2A44" text-anchor="middle">hết 3 câu chính (mỗi câu ≤ 2 follow-up) → POST /interviews/{id}/finish</text>

  <!-- Kết thúc buổi -->
  <rect x="20" y="442" width="290" height="210" rx="12" fill="#FFF4E8" stroke="#E8891C" stroke-width="2"/>
  <text x="170" y="467" font-size="16" font-weight="700" fill="#1F2A44" text-anchor="middle">Kết thúc buổi</text>
  <text x="34" y="492" font-size="14" fill="#1F2A44">Điểm câu i: t_i = S + T + A + R (0–20)</text>
  <text x="34" y="512" font-size="14" fill="#1F2A44">Tổng /10 = Σ t_i / (n · 20) · 10</text>
  <text x="34" y="532" font-size="14" fill="#1F2A44">Câu yếu: t_i / 20 &lt; 0,6 (TB &lt; 3/5)</text>
  <text x="34" y="552" font-size="14" fill="#1F2A44">weak[] = skill_id của câu yếu ∪ gap</text>
  <text x="34" y="572" font-size="14" fill="#1F2A44">ban đầu (tối đa 3 skill)</text>
  <text x="34" y="596" font-size="14" fill="#6B7280">Độ trễ TB = mean(bắt đầu gõ − hiện câu hỏi)</text>
  <text x="34" y="616" font-size="14" fill="#6B7280">Chấm lần 2: max |Δ| &gt; 1,0 → low_confidence</text>
  <text x="34" y="636" font-size="14" fill="#6B7280">(không sinh đề xuất, Lecturer spot-check)</text>

  <path d="M310,547 L358,547" stroke="#1F2A44" stroke-width="2" marker-end="url(#ar)"/>
  <text x="334" y="536" font-size="14" fill="#6B7280" text-anchor="middle">weak[]</text>

  <!-- Vòng phản hồi -->
  <rect x="360" y="424" width="660" height="251" rx="12" fill="#F6F4FF" stroke="#6C5CE7" stroke-width="2"/>
  <text x="690" y="444" font-size="16" font-weight="700" fill="#6C5CE7" text-anchor="middle">Vòng phản hồi (E10) — biến điểm yếu thành đề xuất học bù</text>

  <rect x="374" y="458" width="300" height="200" rx="12" fill="#fff" stroke="#0E9F8E" stroke-width="1.5"/>
  <text x="524" y="480" font-size="15" font-weight="700" fill="#0E9F8E" text-anchor="middle">Cập nhật θ skill (Elo, K = 16)</text>
  <text x="386" y="504" font-size="14" fill="#1F2A44">S = t_i / 20 (điểm câu quy về 0–1)</text>
  <text x="386" y="524" font-size="14" fill="#1F2A44">d = 900 + difficulty · 180</text>
  <text x="386" y="544" font-size="14" fill="#1F2A44">E = 1 / (1 + 10^((d − θ) / 400))</text>
  <text x="386" y="564" font-size="14" fill="#1F2A44" font-weight="700">θ' = θ + 16 · (S − E)</text>
  <text x="386" y="588" font-size="14" fill="#6B7280">S &lt; E → θ giảm (câu yếu hạ θ)</text>
  <text x="386" y="608" font-size="14" fill="#6B7280">S &gt; E → θ tăng nhẹ</text>
  <text x="386" y="632" font-size="14" fill="#6B7280">p = clamp((θ − 1000)/800, 0, 1) · 100</text>

  <rect x="690" y="458" width="316" height="200" rx="12" fill="#fff" stroke="#6C5CE7" stroke-width="1.5"/>
  <text x="848" y="480" font-size="15" font-weight="700" fill="#6C5CE7" text-anchor="middle">build_suggestions(weak, gap)</text>
  <text x="702" y="504" font-size="14" fill="#1F2A44">skill_id → module dạy skill đó, loại module</text>
  <text x="702" y="522" font-size="14" fill="#1F2A44">đã có trong roadmap; xếp hạng hours nhỏ nhất</text>
  <text x="702" y="546" font-size="14" fill="#1F2A44">score = w_jd·(1 − p/100) + 0,2·n_weak_q</text>
  <text x="702" y="570" font-size="14" fill="#1F2A44">Chống trùng: UNIQUE(room, module) pending ·</text>
  <text x="702" y="588" font-size="14" fill="#1F2A44">dismissed → cooldown 14 ngày · accepted → không</text>
  <text x="702" y="606" font-size="14" fill="#1F2A44">gợi lại · tối đa 5 đề xuất/lần</text>
  <text x="702" y="632" font-size="14" fill="#6B7280">không module nào dạy → missing_module_demand</text>

  <path d="M1020,547 L1058,547" stroke="#6C5CE7" stroke-width="2" marker-end="url(#arP)"/>
  <text x="1039" y="536" font-size="14" fill="#6B7280" text-anchor="middle">≤ 5</text>

  <!-- Hộp đề xuất -->
  <rect x="1046" y="470" width="208" height="150" rx="12" fill="#fff" stroke="#6C5CE7" stroke-width="2"/>
  <text x="1150" y="495" font-size="16" font-weight="700" fill="#1F2A44" text-anchor="middle">Hộp đề xuất</text>
  <text x="1150" y="518" font-size="14" fill="#1F2A44" text-anchor="middle">status = pending</text>
  <text x="1150" y="538" font-size="14" fill="#1F2A44" text-anchor="middle">Candidate tự quyết</text>
  <text x="1150" y="566" font-size="14" fill="#2EA05C" text-anchor="middle" font-weight="700">Nhận → accepted</text>
  <text x="1150" y="588" font-size="14" fill="#D93B3B" text-anchor="middle" font-weight="700">Bỏ qua → dismissed</text>
  <text x="1150" y="608" font-size="14" fill="#6B7280" text-anchor="middle">30 ngày im → expired</text>

  <path d="M1254,545 L1318,545" stroke="#0E9F8E" stroke-width="2" marker-end="url(#arT)"/>
  <text x="1286" y="534" font-size="14" fill="#0E9F8E" text-anchor="middle">accept</text>

  <!-- Lõi 1 -->
  <rect x="1320" y="470" width="260" height="150" rx="12" fill="#E6F7F4" stroke="#0E9F8E" stroke-width="2"/>
  <text x="1450" y="495" font-size="16" font-weight="700" fill="#0E9F8E" text-anchor="middle">Lõi 1 — Học thích ứng</text>
  <text x="1450" y="520" font-size="14" fill="#1F2A44" text-anchor="middle">roadmap_items +1 dòng</text>
  <text x="1450" y="538" font-size="14" fill="#1F2A44" text-anchor="middle">source = 'ai_suggested'</text>
  <text x="1450" y="562" font-size="14" fill="#1F2A44" text-anchor="middle">skill_states.theta cập nhật</text>
  <text x="1450" y="580" font-size="14" fill="#1F2A44" text-anchor="middle">→ chọn bài tập dải θ ± 100</text>
  <text x="1450" y="604" font-size="14" fill="#6B7280" text-anchor="middle">accept_rate ≥ 40% là mục tiêu</text>

  <!-- θ → Lõi 1 (đi dưới) -->
  <path d="M524,658 L524,700 L1450,700 L1450,622" fill="none" stroke="#0E9F8E" stroke-width="2" marker-end="url(#arT)"/>
  <text x="990" y="716" font-size="14" fill="#0E9F8E" text-anchor="middle">θ' ghi vào skill_states (room, skill) — cùng trục skill_id với Lõi 1</text>

  <!-- Chú giải -->
  <rect x="20" y="746" width="1560" height="96" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="34" y="770" font-size="15" font-weight="700" fill="#1F2A44">Chú giải</text>
  <rect x="34" y="784" width="18" height="14" rx="3" fill="#FFF4E8" stroke="#E8891C" stroke-width="1.5"/><text x="60" y="796" font-size="14" fill="#1F2A44">Trình duyệt (FE) · con đường sự nghiệp</text>
  <rect x="34" y="808" width="18" height="14" rx="3" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/><text x="60" y="820" font-size="14" fill="#1F2A44">Dịch vụ ngoài: STT / TTS</text>
  <rect x="380" y="784" width="18" height="14" rx="3" fill="#F6F4FF" stroke="#6C5CE7" stroke-width="1.5"/><text x="406" y="796" font-size="14" fill="#1F2A44">Khối AI: bộ chấm, vòng phản hồi</text>
  <rect x="380" y="808" width="18" height="14" rx="3" fill="#1F2A44"/><text x="406" y="820" font-size="14" fill="#1F2A44">Hợp đồng JSON (chung cho Hướng A và B)</text>
  <rect x="740" y="784" width="18" height="14" rx="3" fill="#FFF8E6" stroke="#E8A81C" stroke-width="1.5"/><text x="766" y="796" font-size="14" fill="#1F2A44">Quyết định phía server (ép luật, không tin LLM)</text>
  <rect x="740" y="808" width="18" height="14" rx="3" fill="#E6F7F4" stroke="#0E9F8E" stroke-width="1.5"/><text x="766" y="820" font-size="14" fill="#1F2A44">Lõi 1 — học thích ứng (θ, roadmap)</text>
  <line x1="1140" y1="791" x2="1190" y2="791" stroke="#E8891C" stroke-width="2" stroke-dasharray="8 6"/><text x="1200" y="796" font-size="14" fill="#1F2A44">Vòng lặp lượt tiếp theo (follow_up / next)</text>
  <line x1="1140" y1="815" x2="1190" y2="815" stroke="#1F2A44" stroke-width="2" marker-end="url(#ar)"/><text x="1200" y="820" font-size="14" fill="#1F2A44">Dòng dữ liệu · số xám = độ trễ p50 ước tính</text>
</svg>
