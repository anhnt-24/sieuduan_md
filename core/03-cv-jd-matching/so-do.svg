<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Helvetica Neue, Arial, sans-serif" fill="#1F2A44">
  <defs>
    <marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A44"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8891C"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FED"/></marker>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E9F8E"/></marker>
    <marker id="aW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#FFFFFF"/>

  <!-- Tiêu đề -->
  <text x="800" y="36" text-anchor="middle" font-size="26" font-weight="700">Lõi 3 — CV và so khớp JD</text>
  <text x="800" y="60" text-anchor="middle" font-size="15" fill="#6B7280">Hai luồng vào hội tụ ở trục skill_id → khối so khớp → hai chiều ra (Candidate · Recruiter)</text>

  <!-- Nhãn làn -->
  <text x="40" y="90" font-size="15" font-weight="700" fill="#E8891C" letter-spacing="1">LUỒNG CV (Candidate)</text>
  <text x="840" y="90" font-size="15" font-weight="700" fill="#2F6FED" letter-spacing="1">LUỒNG JD (ba nguồn)</text>

  <!-- Hàng 1: CV -->
  <g stroke="#E8891C" stroke-width="2" fill="#FFFFFF">
    <rect x="40" y="100" width="190" height="78" rx="12"/>
    <rect x="260" y="100" width="260" height="78" rx="12"/>
    <rect x="550" y="100" width="250" height="78" rx="12"/>
  </g>
  <g text-anchor="middle" font-size="14">
    <text x="135" y="124" font-size="16" font-weight="700">Upload CV</text>
    <text x="135" y="145">PDF / DOCX ≤ 5 MB</text>
    <text x="135" y="165">magic bytes · 10/ngày</text>
    <text x="390" y="124" font-size="16" font-weight="700">Bóc chữ</text>
    <text x="390" y="145">PyMuPDF · python-docx · sort (cột, y)</text>
    <text x="390" y="165">&lt; 200 ký tự → gửi PDF cho Claude</text>
    <text x="675" y="124" font-size="16" font-weight="700">Trích xuất (Sonnet 5, JSON)</text>
    <text x="675" y="145">skills{raw, years, level, evidence}</text>
    <text x="675" y="165">roles · education · links · T = 0</text>
  </g>
  <g stroke="#E8891C" stroke-width="2" fill="none" marker-end="url(#aO)">
    <path d="M230,139 L260,139"/>
    <path d="M520,139 L550,139"/>
    <path d="M675,178 L675,300"/>
  </g>
  <text x="684" y="250" font-size="14" fill="#E8891C">skills[].raw</text>

  <!-- Hàng 1: JD ba nguồn -->
  <rect x="840" y="100" width="240" height="78" rx="12" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <rect x="1100" y="100" width="225" height="78" rx="12" fill="#FFFFFF" stroke="#6C5CE7" stroke-width="2"/>
  <rect x="1345" y="100" width="215" height="78" rx="12" fill="#FFFFFF" stroke="#2F6FED" stroke-width="2"/>
  <g text-anchor="middle" font-size="14">
    <text x="960" y="124" font-size="16" font-weight="700" fill="#6B7280">① Crawler theo lịch</text>
    <text x="960" y="145">TopCV, ITviec · Crawlee + Playwright</text>
    <text x="960" y="165">07:00 và 19:00 · trust 0,8</text>
    <text x="1212" y="124" font-size="16" font-weight="700" fill="#6C5CE7">② Agent tìm web</text>
    <text x="1212" y="145">Tavily / Brave · theo yêu cầu</text>
    <text x="1212" y="165">lọc is_job_posting · trust 0,6</text>
    <text x="1452" y="124" font-size="16" font-weight="700" fill="#2F6FED">③ Recruiter nhập</text>
    <text x="1452" y="145">form · sửa và xác nhận skill</text>
    <text x="1452" y="165">trust 1,0</text>
  </g>
  <rect x="960" y="204" width="500" height="70" rx="12" fill="#FFFFFF" stroke="#2F6FED" stroke-width="2"/>
  <text x="1210" y="228" text-anchor="middle" font-size="16" font-weight="700">Pipeline chuẩn hóa chung</text>
  <text x="1210" y="249" text-anchor="middle" font-size="14">parse → extract Haiku 4.5 (JSON) → skills{raw, required, weight 1–3, years_min}</text>
  <text x="1210" y="267" text-anchor="middle" font-size="14">title_map · seniority · salary · province · requirements_text</text>
  <g stroke="#2F6FED" stroke-width="2" fill="none" marker-end="url(#aB)">
    <path d="M960,178 L960,191 L1030,191 L1030,204"/>
    <path d="M1212,178 L1212,204"/>
    <path d="M1452,178 L1452,191 L1390,191 L1390,204"/>
    <path d="M1210,274 L1210,300"/>
  </g>
  <text x="1220" y="292" font-size="14" fill="#2F6FED">skills[].raw</text>

  <!-- Trục skill_id -->
  <rect x="40" y="300" width="1520" height="118" rx="12" fill="#1F2A44"/>
  <text x="800" y="326" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">TRỤC skill_id — mọi chuỗi kỹ năng thô từ CV và JD đều qua map_skill(raw) theo 3 tầng, không tạo skill mới tự do</text>
  <g fill="#FFFFFF" stroke="none">
    <rect x="70" y="342" width="440" height="64" rx="10"/>
    <rect x="570" y="342" width="500" height="64" rx="10"/>
    <rect x="1130" y="342" width="400" height="64" rx="10"/>
  </g>
  <g text-anchor="middle" font-size="14">
    <text x="290" y="366" font-size="15" font-weight="700">Tầng 1 · khớp tên hoặc alias</text>
    <text x="290" y="390">lower(trim(raw)) = skills.name | skill_aliases.alias</text>
    <text x="820" y="366" font-size="15" font-weight="700">Tầng 2 · cosine(embed(raw), skills.embedding) ≥ 0,85</text>
    <text x="820" y="390">top-3 qua pgvector HNSW · loại cặp dễ nhầm (blocklist Java / JavaScript)</text>
    <text x="1330" y="366" font-size="15" font-weight="700">Tầng 3 · hàng đợi unmapped_skills</text>
    <text x="1330" y="390">giữ nguyên raw, freq += 1 → Admin thêm alias</text>
  </g>
  <g stroke="#FFFFFF" stroke-width="2" fill="none" marker-end="url(#aW)">
    <path d="M510,374 L570,374"/>
    <path d="M1070,374 L1130,374"/>
  </g>

  <!-- Hàng 3: sau chuẩn hóa -->
  <g stroke="#E8891C" stroke-width="2" fill="#FFFFFF">
    <rect x="40" y="450" width="190" height="96" rx="12"/>
    <rect x="260" y="450" width="260" height="96" rx="12"/>
    <rect x="550" y="450" width="250" height="96" rx="12"/>
  </g>
  <g stroke="#2F6FED" stroke-width="2" fill="#FFFFFF">
    <rect x="840" y="450" width="350" height="96" rx="12"/>
    <rect x="1230" y="450" width="330" height="96" rx="12"/>
  </g>
  <g text-anchor="middle" font-size="14">
    <text x="135" y="474" font-size="16" font-weight="700">cv_skills</text>
    <text x="135" y="496">(cv_id, skill_id, years, level)</text>
    <text x="135" y="514">map_method · map_cos</text>
    <text x="135" y="532">confirmed_by_user</text>
    <text x="390" y="474" font-size="16" font-weight="700">Embedding bge-m3</text>
    <text x="390" y="496">cvs.embedding vector(1024)</text>
    <text x="390" y="514">toàn văn rút gọn</text>
    <text x="390" y="532">index HNSW vector_cosine_ops</text>
    <text x="675" y="474" font-size="16" font-weight="700">Chấm CV theo quy tắc</text>
    <text x="675" y="496">R0–R10 → score_rule 0–100</text>
    <text x="675" y="514">+ LLM rubric 4 mục → score_final</text>
    <text x="675" y="532">→ điểm + gợi ý sửa theo JD mục tiêu</text>
    <text x="1015" y="474" font-size="16" font-weight="700">Khử trùng lặp</text>
    <text x="1015" y="496">content_hash bằng nhau, hoặc cùng công ty/career</text>
    <text x="1015" y="514">30 ngày, cosine ≥ 0,95 và title trigram ≥ 0,8</text>
    <text x="1015" y="532">giữ: ③ &gt; ① &gt; ② → dài hơn → mới hơn → id nhỏ</text>
    <text x="1395" y="474" font-size="16" font-weight="700">jd_skills + embedding</text>
    <text x="1395" y="496">(jd_id, skill_id, required, weight_1_3)</text>
    <text x="1395" y="514">bge-m3(requirements_text) → vector(1024)</text>
    <text x="1395" y="532">không embed phúc lợi / giới thiệu</text>
  </g>
  <g stroke="#E8891C" stroke-width="2" fill="none" marker-end="url(#aO)">
    <path d="M135,418 L135,450"/>
    <path d="M230,498 L260,498"/>
    <path d="M520,498 L550,498"/>
    <path d="M135,546 L135,574 L370,574 L370,590"/>
    <path d="M395,546 L395,590"/>
  </g>
  <text x="144" y="440" font-size="14" fill="#E8891C">skill_id</text>
  <text x="180" y="568" font-size="14" fill="#E8891C">cv_skills → Have</text>
  <text x="404" y="568" font-size="14" fill="#E8891C">emb_cv</text>
  <g stroke="#2F6FED" stroke-width="2" fill="none" marker-end="url(#aB)">
    <path d="M1015,418 L1015,450"/>
    <path d="M1190,498 L1230,498"/>
    <path d="M1395,546 L1395,574 L1220,574 L1220,590"/>
  </g>
  <text x="1024" y="440" font-size="14" fill="#2F6FED">skill_id</text>
  <text x="1232" y="568" font-size="14" fill="#2F6FED">jd_skills (wᵢ) + emb_jd</text>

  <!-- Lõi học -->
  <rect x="40" y="620" width="250" height="90" rx="12" fill="#DDF3EF" stroke="#0E9F8E" stroke-width="2"/>
  <text x="165" y="646" text-anchor="middle" font-size="16" font-weight="700" fill="#0E9F8E">Lõi học thích ứng</text>
  <text x="165" y="668" text-anchor="middle" font-size="14">skill_states (θ → proficiency p)</text>
  <text x="165" y="688" text-anchor="middle" font-size="14">p ≥ 60 → được tính là "có"</text>
  <path d="M290,665 L330,665" stroke="#0E9F8E" stroke-width="2" fill="none" marker-end="url(#aT)"/>

  <!-- Khối so khớp -->
  <rect x="330" y="590" width="940" height="160" rx="12" fill="#FCEBD6" stroke="#E8891C" stroke-width="3"/>
  <text x="800" y="616" text-anchor="middle" font-size="19" font-weight="700">SO KHỚP CV × JD</text>
  <text x="800" y="644" text-anchor="middle" font-size="16" font-weight="700">match = 0,7 · skill_match + 0,3 · cosine(emb_cv, emb_jd_requirements)</text>
  <text x="800" y="670" text-anchor="middle" font-size="15">skill_match = Σ wᵢ·cᵢ / Σ wᵢ        wᵢ = weight_1_3 · (1 nếu required · 0,5 nếu nice-to-have)</text>
  <text x="800" y="696" text-anchor="middle" font-size="15">cᵢ = 1 nếu skill_id ∈ Have · 0,5 nếu cùng broader_id hoặc cosine ≥ 0,8 · 0 nếu thiếu → gap</text>
  <text x="800" y="722" text-anchor="middle" font-size="15" font-weight="700">Have = cv_skills ∪ { skill_states : proficiency ≥ 60 }   (tự khai ∪ đo được)</text>
  <text x="800" y="742" text-anchor="middle" font-size="14" fill="#6B7280">Admin chỉnh w_skill / w_cos trong settings.match_weights (ràng buộc w_skill + w_cos = 1), cache 60 s</text>

  <!-- Hai chiều ra -->
  <rect x="40" y="790" width="700" height="112" rx="12" fill="#FFFFFF" stroke="#E8891C" stroke-width="2"/>
  <text x="390" y="816" text-anchor="middle" font-size="16" font-weight="700" fill="#E8891C">CHIỀU THUẬN · Candidate</text>
  <text x="390" y="840" text-anchor="middle" font-size="14">% match + danh sách gap (cᵢ = 0) → gợi ý sửa CV theo JD mục tiêu</text>
  <text x="390" y="860" text-anchor="middle" font-size="14">gap → học phần chứa skill_id → suggestions(origin = 'jd_match', status = 'pending')</text>
  <text x="390" y="880" text-anchor="middle" font-size="14">không tạo trùng đề xuất đang pending (UNIQUE partial index)</text>
  <rect x="860" y="790" width="700" height="112" rx="12" fill="#FFFFFF" stroke="#2F6FED" stroke-width="2"/>
  <text x="1210" y="816" text-anchor="middle" font-size="16" font-weight="700" fill="#2F6FED">CHIỀU NGƯỢC · Recruiter</text>
  <text x="1210" y="840" text-anchor="middle" font-size="14">1 JD × N ứng viên cùng career, danh sách ẩn danh, lọc min_match</text>
  <text x="1210" y="860" text-anchor="middle" font-size="14">recruiter_score = match + 0,1 · (mock_score / 10) · tie-break last_active_at</text>
  <text x="1210" y="880" text-anchor="middle" font-size="14">precompute vào bảng matches khi JD tạo/sửa · refresh 02:00 hằng ngày</text>
  <path d="M600,750 L600,790" stroke="#E8891C" stroke-width="2" fill="none" marker-end="url(#aO)"/>
  <path d="M1000,750 L1000,790" stroke="#2F6FED" stroke-width="2" fill="none" marker-end="url(#aB)"/>
  <text x="608" y="776" font-size="14" fill="#E8891C">%, gap</text>
  <text x="1008" y="776" font-size="14" fill="#2F6FED">xếp hạng</text>

  <!-- Vòng phản hồi về lõi học -->
  <rect x="40" y="930" width="700" height="52" rx="12" fill="#DDF3EF" stroke="#0E9F8E" stroke-width="2"/>
  <text x="390" y="952" text-anchor="middle" font-size="15" font-weight="700" fill="#0E9F8E">Vòng phản hồi → Lõi học thích ứng (roadmap)</text>
  <text x="390" y="972" text-anchor="middle" font-size="14">Candidate nhận đề xuất → roadmap_items(source = 'from_suggestion') · bỏ qua → giữ nguyên</text>
  <path d="M390,902 L390,930" stroke="#0E9F8E" stroke-width="2" fill="none" marker-end="url(#aT)"/>
  <text x="398" y="922" font-size="14" fill="#0E9F8E">đề xuất pending</text>

  <!-- Chú giải -->
  <g font-size="14">
    <rect x="860" y="936" width="14" height="14" rx="3" fill="#E8891C"/><text x="882" y="948">Luồng CV · Candidate</text>
    <rect x="1080" y="936" width="14" height="14" rx="3" fill="#2F6FED"/><text x="1102" y="948">Luồng JD · Recruiter</text>
    <rect x="1300" y="936" width="14" height="14" rx="3" fill="#1F2A44"/><text x="1322" y="948">Trục skill_id (dùng chung)</text>
    <rect x="860" y="964" width="14" height="14" rx="3" fill="#6B7280"/><text x="882" y="976">Crawler theo lịch</text>
    <rect x="1080" y="964" width="14" height="14" rx="3" fill="#6C5CE7"/><text x="1102" y="976">Agent tìm web · LLM</text>
    <rect x="1300" y="964" width="14" height="14" rx="3" fill="#0E9F8E"/><text x="1322" y="976">Lõi học thích ứng</text>
  </g>
</svg>
