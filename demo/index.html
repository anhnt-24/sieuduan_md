<title>DevRoom Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F5F9;--surface:#FFFFFF;--surface-2:#E9EEF5;--line:#D9E0EA;--line-strong:#B9C4D3;
  --ink:#1F2A44;--ink-2:#4A5872;--muted:#7A879C;
  --navy:#1F2A44;--teal:#0E9F8E;--orange:#E8891C;--green:#2EA05C;--blue:#2F6FED;--gray:#6B7280;--purple:#6C5CE7;
  --teal-soft:#DDF3EF;--orange-soft:#FCEBD6;--green-soft:#DDF3E4;--blue-soft:#DEE8FD;--gray-soft:#E6E8EC;--purple-soft:#E6E3FB;
  --good:#2EA05C;--warn:#E8A81C;--bad:#D93B3B;--good-soft:#DDF3E4;--warn-soft:#FBF0D2;--bad-soft:#F9DCDC;
  --accent:#0E9F8E;--accent-soft:#DDF3EF;--on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(31,42,68,.06),0 8px 24px rgba(31,42,68,.08);
  --radius:10px;--font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1626;--surface:#172033;--surface-2:#1F2A40;--line:#2A3650;--line-strong:#3A4A68;
    --ink:#E6ECF5;--ink-2:#B7C2D4;--muted:#8391A8;--navy:#E6ECF5;
    --teal:#2BC4B0;--orange:#F5A54A;--green:#4CC47A;--blue:#6B95F5;--gray:#9AA3B2;--purple:#9B8EF7;
    --teal-soft:#153C3A;--orange-soft:#3E2C15;--green-soft:#173A26;--blue-soft:#1C2A4E;--gray-soft:#2A3140;--purple-soft:#2B2650;
    --good:#4CC47A;--warn:#F2C14E;--bad:#F06A6A;--good-soft:#173A26;--warn-soft:#3E3416;--bad-soft:#44201F;
    --accent:#2BC4B0;--accent-soft:#153C3A;--on-accent:#0B1220;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1626;--surface:#172033;--surface-2:#1F2A40;--line:#2A3650;--line-strong:#3A4A68;
  --ink:#E6ECF5;--ink-2:#B7C2D4;--muted:#8391A8;--navy:#E6ECF5;
  --teal:#2BC4B0;--orange:#F5A54A;--green:#4CC47A;--blue:#6B95F5;--gray:#9AA3B2;--purple:#9B8EF7;
  --teal-soft:#153C3A;--orange-soft:#3E2C15;--green-soft:#173A26;--blue-soft:#1C2A4E;--gray-soft:#2A3140;--purple-soft:#2B2650;
  --good:#4CC47A;--warn:#F2C14E;--bad:#F06A6A;--good-soft:#173A26;--warn-soft:#3E3416;--bad-soft:#44201F;
  --accent:#2BC4B0;--accent-soft:#153C3A;--on-accent:#0B1220;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance;font-weight:600}
h1{font-size:22px}h2{font-size:17px}h3{font-size:15px}h4{font-size:13.5px}
p{margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
code,.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* role accents */
[data-role="candidate"]{--accent:var(--teal);--accent-soft:var(--teal-soft)}
[data-role="lecturer"]{--accent:var(--green);--accent-soft:var(--green-soft)}
[data-role="recruiter"]{--accent:var(--blue);--accent-soft:var(--blue-soft)}
[data-role="admin"]{--accent:var(--gray);--accent-soft:var(--gray-soft)}
.path-career{--accent:var(--orange);--accent-soft:var(--orange-soft)}
.ai-scope{--accent:var(--purple);--accent-soft:var(--purple-soft)}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:16px;padding-inline:16px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.logo .mark{width:26px;height:26px;border-radius:7px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600}
:root[data-theme="dark"] .logo .mark{color:#0F1626}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo .mark{color:#0F1626}}
.demo-tag{font-size:11px;color:var(--muted);border:1px dashed var(--line-strong);border-radius:999px;padding:1px 8px;white-space:nowrap}
.seg{display:flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;margin-left:auto}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* shell */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:calc(100vh - 56px)}
.side{border-right:1px solid var(--line);background:var(--surface);padding:14px 10px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.side .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 6px;font-weight:600}
.side a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;color:var(--ink-2);text-decoration:none;font-weight:500}
.side a:hover{background:var(--surface-2)}
.side a.on{background:var(--accent-soft);color:var(--ink)}
.side a .n{font-family:var(--mono);font-size:11px;color:var(--muted);width:16px}
.side a.on .n{color:var(--accent)}
.main{padding:24px 24px 96px;max-width:1120px;width:100%;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:600;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card.raised{box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:500;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge.teal{background:var(--teal-soft);color:var(--teal)}
.badge.orange{background:var(--orange-soft);color:var(--orange)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.gray{background:var(--gray-soft);color:var(--gray)}
.badge.purple{background:var(--purple-soft);color:var(--purple)}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.chip.gap{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.chip.have{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.input,.select,.textarea{width:100%;border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px;background:var(--surface);color:var(--ink)}
.textarea{min-height:90px;resize:vertical}
.textarea.code{font-family:var(--mono);font-size:13px;min-height:220px;line-height:1.5;tab-size:2}
.progress{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px}
.progress.good i{background:var(--good)}.progress.warn i{background:var(--warn)}.progress.bad i{background:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:var(--radius)}
.stat{padding:14px 16px}
.stat .lbl{font-size:12px;color:var(--muted)}
.stat .val{font-family:var(--mono);font-size:24px;font-weight:600;margin-top:2px}
.stat .val small{font-size:13px;color:var(--muted);font-weight:400}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:7px;padding:8px 10px}
.note.ai{background:var(--purple-soft);color:var(--ink)}
.note.ai b{color:var(--purple)}
.divider{height:1px;background:var(--line);margin:14px 0}
.list{display:flex;flex-direction:column}
.list > div{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list > div:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list .t{font-weight:500}
.list .m{font-size:12px;color:var(--muted)}
.score-big{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1}

/* rooms */
.room{cursor:pointer;position:relative;transition:transform .12s}
.room:hover{transform:translateY(-1px)}
.room.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.room .career{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.room .pct{font-family:var(--mono);font-size:26px;font-weight:600}

/* quiz */
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--line-strong);background:var(--surface-2)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--muted);width:16px;flex:none;padding-top:2px}
.theta{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* flashcard */
.flash{perspective:1000px;height:200px;cursor:pointer}
.flash .in{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.flash.flipped .in{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);font-size:15px}
.flash .face.back{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent)}
.sm2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sm2 button{flex-direction:column;align-items:center;gap:1px;padding:8px 6px}
.sm2 button small{font-size:11px;color:var(--muted);font-weight:400}

/* sandbox */
.cases{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:12.5px}
.cases div{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;background:var(--surface-2)}
.cases .ok{color:var(--good)}.cases .ko{color:var(--bad)}
.cases .st{width:44px;font-weight:600;flex:none}

/* CV */
.cv-prev{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;font-size:13px;min-height:320px}
.cv-prev h2{font-size:20px;margin-bottom:2px}
.cv-prev .sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:3px}
.cv-prev ul{margin:0;padding-left:18px}

/* jobs / kanban */
.jd{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.match{font-family:var(--mono);font-size:22px;font-weight:600;text-align:right}
.match small{font-size:11px;color:var(--muted);display:block;font-weight:400}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:10px;overflow-x:auto}
.kcol{background:var(--surface-2);border-radius:8px;padding:10px;min-height:120px}
.kcol h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:9px 10px;margin-bottom:8px;font-size:12.5px}
.kcard .t{font-weight:600}
.kcard .m{color:var(--muted);font-size:11.5px;margin-bottom:6px}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow:auto;padding:4px}
.msg{max-width:78%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.45}
.msg.ai{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.msg .who{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;opacity:.7;margin-bottom:2px;font-weight:600}
.star{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.star div{text-align:center;background:var(--surface-2);border-radius:6px;padding:6px}
.star b{font-family:var(--mono);font-size:18px;display:block}
.star small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* AI panel */
.fab{position:fixed;right:20px;bottom:20px;z-index:30;border:0;background:var(--purple);color:#fff;border-radius:999px;padding:11px 16px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
.panel{position:fixed;right:20px;bottom:76px;width:min(380px,calc(100vw - 32px));max-height:min(560px,calc(100vh - 100px));z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.panel .ph{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:600}
.panel .ph .dot{width:9px;height:9px;border-radius:50%;background:var(--purple)}
.panel .chat{flex:1;padding:12px;max-height:none}
.panel .quick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line)}
.panel form{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}

/* toast / modal */
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--navy);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);max-width:min(480px,calc(100vw - 32px));animation:up .2s ease-out}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.modal-bg{position:fixed;inset:0;background:rgba(15,22,38,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}

/* chart */
.bars{width:100%;height:auto;display:block}
.bars text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.bars line{stroke:var(--line)}
.bars rect{fill:var(--blue)}

@media (max-width:720px){
  .topbar{gap:8px;padding-inline:12px}
  .demo-tag{display:none}
  .seg{margin-left:auto}
  .seg button{padding:5px 8px;font-size:12px}
  .seg button span{display:none}
  .seg button i{margin-right:0}
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:56px;height:auto;display:flex;gap:2px;overflow-x:auto;padding:6px 8px;border-right:0;border-bottom:1px solid var(--line);scrollbar-width:none}
  .side .grp{display:none}
  .side a{white-space:nowrap;padding:6px 10px}
  .side a .n{display:none}
  .main{padding:16px 16px 96px}
  .grid{grid-template-columns:1fr!important}
  .jd{grid-template-columns:1fr}
  .match{text-align:left}
  .sm2{grid-template-columns:repeat(2,1fr)}
  .msg{max-width:92%}
}
</style>
<div id="app" data-role="candidate">
  <header class="topbar">
    <div class="logo"><span class="mark">&lt;/&gt;</span>DevRoom</div>
    <span class="demo-tag">Bản demo mock · dữ liệu giả · chạy trong trình duyệt</span>
    <div class="seg" id="roleSeg" role="group" aria-label="Vai trò">
      <button data-role="candidate" aria-pressed="true"><i style="background:var(--teal)"></i><span>Candidate</span></button>
      <button data-role="lecturer"><i style="background:var(--green)"></i><span>Lecturer</span></button>
      <button data-role="recruiter"><i style="background:var(--blue)"></i><span>Recruiter</span></button>
      <button data-role="admin"><i style="background:var(--gray)"></i><span>Admin</span></button>
    </div>
    <button class="btn sm" id="btnReset" title="Xóa localStorage và seed lại">Reset demo</button>
  </header>
  <div class="shell">
    <nav class="side" id="side" aria-label="Điều hướng"></nav>
    <main class="main" id="main"></main>
  </div>
  <button class="fab" id="fab" aria-label="Mở trợ lý AI">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.5l1.6 3.9 3.9 1.6-3.9 1.6L8 12.5 6.4 8.6 2.5 7l3.9-1.6z" fill="currentColor"/></svg>
    Trợ lý AI
  </button>
  <aside class="panel ai-scope" id="panel" hidden aria-label="Trợ lý AI">
    <div class="ph"><span class="dot"></span><span id="panelTitle">Trợ lý AI</span><button class="btn ghost sm" id="panelClose" style="margin-left:auto">Đóng</button></div>
    <div class="chat" id="panelChat"></div>
    <div class="quick" id="panelQuick"></div>
    <form id="panelForm"><input class="input" id="panelInput" placeholder="Hỏi về roadmap, CV, việc làm, phỏng vấn…" autocomplete="off"><button class="btn primary" type="submit">Gửi</button></form>
  </aside>
  <div class="toasts" id="toasts"></div>
  <div id="modalRoot"></div>
</div>

const room=()=>S.rooms.find(r=>r.id===S.activeRoom)||S.rooms[0];

function cvSkillIds(){const txt=(S.cv.skills||"").toLowerCase();return Object.keys(SKILLS).filter(k=>{const n=SKILLS[k].toLowerCase();return txt.includes(n.split(/[\/ (]/)[0].toLowerCase())||txt.includes(k)})}
function mySkillSet(){const r=room();const p=roomProf(r);const set=new Set(cvSkillIds());Object.keys(p).forEach(k=>{if(p[k]>=60)set.add(k)});return set}
function myVector(){const r=room();const p=roomProf(r);const v={};Object.keys(p).forEach(k=>v[k]=p[k]/100);cvSkillIds().forEach(k=>{v[k]=Math.max(v[k]||0,.6)});return v}
/* % match = 0.7·skill_match + 0.3·cosine */
function matchJD(jd){
  const have=mySkillSet();const v=myVector();
  const inter=jd.skills.filter(s=>have.has(s));const sm=inter.length/jd.skills.length;
  const keys=new Set([...Object.keys(v),...jd.skills]);let dot=0,a=0,b=0;
  keys.forEach(k=>{const x=v[k]||0,y=jd.skills.includes(k)?1:0;dot+=x*y;a+=x*x;b+=y*y});
  const cos=(a&&b)?dot/Math.sqrt(a*b):0;
  return {pct:Math.round((0.7*sm+0.3*cos)*100),have:inter,gap:jd.skills.filter(s=>!have.has(s)),sm,cos};
}
/* Elo / CAT */
function kFor(n){return n<3?64:n<6?32:16}
function expected(theta,d){return 1/(1+Math.pow(10,(d-theta)/400))}
function pickQuestion(r,asked){
  const c=careerOf(r.career);const cnt={};c.skills.forEach(s=>cnt[s]=r.answered[s]||0);
  const order=[...c.skills].sort((a,b)=>cnt[a]-cnt[b]);
  for(const s of order){const th=r.theta[s]??1200;const pool=QBANK.map((q,i)=>({q,i})).filter(x=>x.q.s===s&&!asked.includes(x.i));if(pool.length){pool.sort((x,y)=>Math.abs(x.q.d-th)-Math.abs(y.q.d-th));return pool[0].i}}
  return -1;
}
function eloUpdate(r,qi,correct,n){const q=QBANK[qi];const th=r.theta[q.s]??1200;const E=expected(th,q.d);const K=kFor(n);const nt=Math.round(th+K*((correct?1:0)-E));r.theta[q.s]=nt;r.answered[q.s]=(r.answered[q.s]||0)+1;return {E,K,from:th,to:nt}}
/* SM-2 */
function sm2(card,q){const c=card||{ef:2.5,interval:0,reps:0};let {ef,interval,reps}=c;
  if(q<3){reps=0;interval=1}else{interval=reps===0?1:reps===1?6:Math.round(interval*ef);reps++}
  ef=Math.max(1.3,ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));
  const due=new Date();due.setDate(due.getDate()+interval);
  return {ef:+ef.toFixed(2),interval,reps,due:due.toISOString().slice(0,10)}}

function addSuggestion(roomId,mid,reason,src){if(S.suggestions.some(s=>s.roomId===roomId&&s.mid===mid&&s.status==="pending"))return false;S.suggestions.push({id:"s"+uid(),roomId,mid,reason,src,status:"pending"});return true}
function suggestFromGap(roomId,gapSkills,src,ctx){let n=0;gapSkills.forEach(s=>{const m=S.modules.find(m=>m.skills.includes(s));if(m&&!(S.roadmap[roomId]||[]).some(x=>x.mid===m.id)){if(addSuggestion(roomId,m.id,`${ctx}: thiếu ${SKILLS[s]}.`,src))n++}});return n}
function ensureRoadmap(r){if(S.roadmap[r.id])return;const base=S.base[r.career]||[];const p=roomProf(r);const list=base.map(mid=>({mid,status:"todo"}));
  Object.keys(p).filter(s=>p[s]<50).forEach(s=>{const m=S.modules.find(m=>m.skills.includes(s));if(m&&!list.some(x=>x.mid===m.id))list.unshift({mid:m.id,status:"todo"})});
  S.roadmap[r.id]=list}

function targetJD(){const r=room();const inC=S.jds.filter(j=>j.career===r.career);return (inC.length?inC:S.jds).map(j=>({j,m:matchJD(j)})).sort((a,b)=>b.m.pct-a.m.pct)[0].j}
function cvEval(){const cv=S.cv;const bullets=(cv.exp||"").split("\n").map(s=>s.trim()).filter(Boolean);const tips=[];let sc=40;
 if(cv.name&&cv.title)sc+=10;else tips.push("Điền đầy đủ họ tên và vị trí mục tiêu.");
 const withNum=bullets.filter(b=>/\d/.test(b)).length;sc+=Math.min(18,withNum*6);if(withNum<bullets.length)tips.push(`${bullets.length-withNum} bullet kinh nghiệm chưa có số liệu (%, số người dùng, thời gian). Thêm con số đo được.`);
 const long=bullets.filter(b=>b.length>140).length;sc-=long*5;if(long)tips.push(`${long} bullet dài hơn 140 ký tự. Rút gọn còn 1 ý/bullet.`);
 if(bullets.length>=3)sc+=8;else tips.push("Nên có ít nhất 3 bullet kinh nghiệm/dự án.");
 if(/github\.com\//i.test(cv.github||""))sc+=8;else tips.push("Thiếu link GitHub. Recruiter IT gần như luôn xem code.");
 const nSk=(cv.skills||"").split(",").map(s=>s.trim()).filter(Boolean).length;if(nSk>=4)sc+=6;else tips.push("Liệt kê ít nhất 4 kỹ năng cụ thể (framework, DB, công cụ).");
 const jd=targetJD();const have=new Set(cvSkillIds());const miss=jd.skills.filter(s=>!have.has(s));sc-=miss.length*4;if(miss.length)tips.push(`So với JD mục tiêu "${jd.title}" (${jd.company}), CV chưa nhắc tới: ${miss.map(s=>SKILLS[s]).join(", ")}.`);
 if(!/[A-Za-z]/.test(cv.title||""))tips.push("Vị trí mục tiêu nên ghi bằng tên chuẩn thị trường (VD: Frontend Developer).");
 return {score:clamp(Math.round(sc),0,100),tips,jd}}
PAGES["candidate/cv"]=()=>{const cv=S.cv;const ev=S.cvScore;const bullets=(cv.exp||"").split("\n").map(s=>s.trim()).filter(Boolean);
 return head("Con đường sự nghiệp · 5","CV","AI tạo CV từ phòng học hoặc tự viết. AI đánh giá theo rule, gợi ý sửa theo JD mục tiêu.",`<button class="btn" data-a="cvGen">AI tạo CV từ phòng học</button><button class="btn primary" data-a="cvEval">AI đánh giá</button>`)+
 `<div class="grid g2"><div class="stack"><div class="card"><div class="stack">
  <label class="f">Họ tên<input class="input" id="cvName" value="${esc(cv.name)}" oninput="ACT.cvInput(this,'name')"></label>
  <label class="f">Vị trí mục tiêu<input class="input" id="cvTitle" value="${esc(cv.title)}" oninput="ACT.cvInput(this,'title')"></label>
  <label class="f">Kỹ năng (phân cách bằng dấu phẩy)<input class="input" id="cvSkills" value="${esc(cv.skills)}" oninput="ACT.cvInput(this,'skills')"></label>
  <label class="f">GitHub<input class="input" id="cvGithub" value="${esc(cv.github)}" placeholder="https://github.com/…" oninput="ACT.cvInput(this,'github')"></label>
  <label class="f">Kinh nghiệm / dự án (mỗi dòng 1 bullet)<textarea class="textarea" id="cvExp" oninput="ACT.cvInput(this,'exp')">${esc(cv.exp)}</textarea></label></div></div>
  ${ev?`<div class="card"><div class="row between"><h2>Điểm CV</h2><span class="score-big" style="color:var(--${ev.score>=75?"good":ev.score>=50?"warn":"bad"})">${ev.score}<span style="font-size:16px;color:var(--muted)">/100</span></span></div>${bar(ev.score,profCls(ev.score))}<p class="sub" style="margin:8px 0 10px">JD mục tiêu: ${esc(ev.jd.title)} · ${esc(ev.jd.company)}</p>
   ${ev.tips.length?`<ul style="margin:0;padding-left:18px;display:grid;gap:6px">${ev.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:`<p>Không có gợi ý sửa. CV ổn.</p>`}</div>`:""}</div>
 <div class="cv-prev"><h2>${esc(cv.name)||"Họ tên"}</h2><div style="color:var(--accent);font-weight:600">${esc(cv.title)||"Vị trí mục tiêu"}</div>${cv.github?`<div class="sub mono">${esc(cv.github)}</div>`:""}
  <div class="sec">Kỹ năng</div><div class="chips">${(cv.skills||"").split(",").map(s=>s.trim()).filter(Boolean).map(s=>`<span class="chip">${esc(s)}</span>`).join("")||"<span class='sub'>—</span>"}</div>
  <div class="sec">Kinh nghiệm & dự án</div>${bullets.length?`<ul>${bullets.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`:"<span class='sub'>—</span>"}
  <div class="sec">Năng lực từ DevRoom</div><div class="chips">${Object.entries(roomProf(room())).filter(x=>x[1]>=60).map(x=>`<span class="chip have">${SKILLS[x[0]]} ${x[1]}</span>`).join("")||"<span class='sub'>Chưa có skill đạt ngưỡng</span>"}</div></div></div>`};
ACT.cvInput=(el,k)=>{S.cv[k]=el.value;S.cvScore=null;save()};
ACT.cvGen=()=>{const r=room();const t=CV_TEMPLATES[r.career];const p=roomProf(r);S.cv.title=t.title;S.cv.exp=t.exp;S.cv.skills=Object.keys(p).filter(s=>p[s]>=45).map(s=>SKILLS[s]).join(", ")||careerOf(r.career).skills.map(s=>SKILLS[s]).join(", ");S.cv.github=S.cv.github||"https://github.com/"+(S.cv.name||"devroom").toLowerCase().replace(/[^a-z]/g,"");S.cvScore=null;log("AI tạo CV nháp từ phòng học",2400);toast("Đã điền CV mẫu từ phòng học. Sửa lại cho đúng thực tế.");route()};
ACT.cvEval=()=>{S.cvScore=cvEval();log(`AI đánh giá CV: ${S.cvScore.score}/100`,1720);route()};

 `<div class="grid g2">${list.map(({j,m})=>{const ap=S.apps.find(a=>a.jdId===j.id);return `<div class="card jd"><div><div class="row" style="gap:6px"><span class="badge ${SRC[j.src][1]}">${SRC[j.src][0]}</span><span class="badge">${j.level}</span><span class="sub">${esc(j.from)}</span></div>
  <h3 style="margin:8px 0 2px">${esc(j.title)}</h3><div class="sub">${esc(j.company)} · ${esc(j.city)} · <span class="num">${j.salary[0]}–${j.salary[1]} triệu</span></div>
  <p style="margin:8px 0;font-size:13px">${esc(j.desc)}</p><div class="chips">${j.skills.map(s=>`<span class="chip ${m.have.includes(s)?"have":"gap"}">${SKILLS[s]}</span>`).join("")}</div>
  <div class="row" style="margin-top:10px">${ap?`<span class="badge good">${STAGES[ap.stage]}</span>`:`<button class="btn sm primary" data-a="apply" data-id="${j.id}">Ứng tuyển</button>`}${m.gap.length?`<button class="btn sm" data-a="sugFromJD" data-id="${j.id}">Tạo đề xuất cải thiện lộ trình</button>`:""}</div></div>
  <div class="match" style="color:var(--${m.pct>=70?"good":m.pct>=45?"warn":"bad"})">${m.pct}%<small>skill ${Math.round(m.sm*100)}% · cos ${m.cos.toFixed(2)}</small><small>gap: ${m.gap.length}</small></div></div>`}).join("")}</div>
 <div class="card" style="margin-top:18px"><h2 style="margin-bottom:10px">Theo dõi ứng tuyển</h2><div class="kanban">${STAGES.map((st,i)=>`<div class="kcol"><h4>${st}<span>${S.apps.filter(a=>a.stage===i).length}</span></h4>${S.apps.filter(a=>a.stage===i).map(a=>{const j=S.jds.find(x=>x.id===a.jdId);return `<div class="kcard"><div class="t">${esc(j.title)}</div><div class="m">${esc(j.company)} · nộp ${a.date}</div><div class="row" style="gap:4px"><button class="btn sm ghost" data-a="move" data-id="${j.id}" data-d="-1" ${i===0?"disabled":""}>←</button><button class="btn sm ghost" data-a="move" data-id="${j.id}" data-d="1" ${i===3?"disabled":""}>→</button></div></div>`}).join("")}</div>`).join("")}</div></div>`};
ACT.jobFilter=el=>{S.jobFilter=el.value;route()};
ACT.apply=el=>{S.apps.push({jdId:el.dataset.id,stage:0,date:today()});const j=S.jds.find(x=>x.id===el.dataset.id);log(`Ứng tuyển ${j.title} (${j.company})`);toast("Đã nộp hồ sơ");route()};
ACT.move=el=>{const a=S.apps.find(x=>x.jdId===el.dataset.id);a.stage=clamp(a.stage+ +el.dataset.d,0,3);log(`Ứng tuyển ${a.jdId} → ${STAGES[a.stage]}`);route()};
ACT.sugFromJD=el=>{const j=S.jds.find(x=>x.id===el.dataset.id);const m=matchJD(j);const n=suggestFromGap(room().id,m.gap,"matching",`Match JD ${j.id} ${j.title} (${m.pct}%)`);log(`Tạo đề xuất cải thiện từ JD ${j.id}: ${n} học phần`,620);toast(n?`Đã đẩy ${n} đề xuất vào hộp đề xuất ở Roadmap`:"Không có học phần mới để đề xuất (đã có trong roadmap hoặc đang chờ)");route()};

const SAMPLE_ANS={fe:["Trong dự án dashboard, bảng 2.000 dòng bị giật khi lọc. Tôi dùng React Profiler tìm ra component hàng re-render toàn bộ, bọc bằng React.memo, chuyển filter sang useMemo và thêm key ổn định. Kết quả thời gian render giảm từ 800ms xuống 120ms.","Tôi giữ dữ liệu form trong state, khi API lỗi thì hiện toast kèm nút thử lại và không xóa dữ liệu. Với thao tác nhỏ tôi dùng optimistic update rồi rollback khi catch lỗi.","Tôi dùng CSS Modules cho component, design token bằng CSS variables cho màu và spacing, đặt tên theo BEM trong module. Mỗi PR có checklist không dùng style global."],
 be:["Tôi thiết kế API đơn hàng theo REST: /orders, /orders/{id}. Dùng schema Pydantic để validate, trả 400 khi sai dữ liệu, 404 khi không tìm thấy, 401/403 cho xác thực và quyền. Có version /v1 để nâng cấp sau.","Tôi chạy EXPLAIN ANALYZE, phát hiện seq scan trên bảng orders 2 triệu dòng, thêm index composite (customer_id, created_at) và gộp N+1 bằng join. Query giảm từ 6s xuống 200ms.","Tôi dùng JWT access token ngắn hạn kèm refresh token, phân quyền theo role ở middleware, rate limit bằng Redis 100 request/phút, bắt buộc HTTPS và hash mật khẩu bằng bcrypt."]};
function starScore(a,kw,diff){const L=a.length;const t=a.toLowerCase();const hits=kw.filter(k=>t.includes(k)).length;const has=re=>re.test(t);
 let s=has(/dự án|khi |lúc |tình huống|trong |hồi /)?Math.min(5,2+Math.floor(L/120)):Math.min(2,Math.floor(L/100));
 let tt=has(/mục tiêu|cần |yêu cầu|nhiệm vụ|phải |bài toán/)?Math.min(5,3+Math.floor(L/200)):Math.min(2,Math.floor(L/150));
 let ac=Math.min(5,1+hits);let r=has(/\d/)&&has(/giảm|tăng|kết quả|còn|xuống|lên|đạt/)?5:has(/kết quả|giảm|tăng/)?3:L>150?2:1;
 const k=diff==="Khó"?.8:diff==="Dễ"?1.1:1;return {S:clamp(Math.round(s*k),0,5),T:clamp(Math.round(tt*k),0,5),A:clamp(Math.round(ac*k),0,5),R:clamp(Math.round(r*k),0,5)}}
PAGES["candidate/interview"]=()=>{const iv=S.iv;const top=head("Con đường sự nghiệp · 7","AI Mock interview","Người phỏng vấn AI theo kịch bản career, 3 câu chính + follow-up nếu trả lời ngắn. STT/TTS tiếng Việt là mock.");
 if(!iv){const hist=S.interviews.slice().reverse();return top+`<div class="grid g2"><div class="card"><h2>Thiết lập buổi phỏng vấn</h2><div class="stack" style="margin-top:12px">
  <label class="f">Mục tiêu<select class="select" id="ivTarget"><optgroup label="Theo JD">${S.jds.map(j=>`<option value="jd:${j.id}">${esc(j.title)} · ${esc(j.company)}</option>`).join("")}</optgroup><optgroup label="Theo phòng học">${S.rooms.map(r=>`<option value="room:${r.id}" ${r.id===S.activeRoom?"selected":""}>${esc(r.name)}</option>`).join("")}</optgroup></select></label>
  <label class="f">Độ khó<select class="select" id="ivDiff"><option>Dễ</option><option selected>Trung bình</option><option>Khó</option></select></label>
  <button class="btn primary" data-a="ivStart">Bắt đầu phỏng vấn</button></div></div>
  <div class="card"><h2>Lịch sử</h2>${hist.length?`<div class="list">${hist.map(h=>`<div><div class="grow"><div class="t">${esc(h.target)}</div><div class="m">${h.date} · ${h.diff} · yếu: ${h.weak.map(s=>SKILLS[s]).join(", ")||"—"}</div></div><span class="score-big" style="font-size:22px">${h.score}</span></div>`).join("")}</div>`:`<p class="sub" style="margin-top:8px">Chưa có buổi nào.</p>`}</div></div>`}
 const chat=`<div class="chat" id="ivChat">${iv.msgs.map(m=>`<div class="msg ${m.who}"><div class="who">${m.who==="ai"?"Người phỏng vấn AI":"Bạn"}</div>${esc(m.text)}</div>`).join("")}</div>`;
 if(iv.done){const sc=iv.answers;const tot=iv.score;return top+`<div class="grid g2"><div class="card"><div class="row between"><h2>${esc(iv.target)}</h2><span class="badge">${iv.diff}</span></div>${chat}<div class="row" style="margin-top:10px"><button class="btn" data-a="ivEnd">Phỏng vấn buổi khác</button></div></div>
  <div class="stack"><div class="card"><div class="row between"><h2>Scorecard STAR</h2><span class="score-big" style="color:var(--${tot>=7.5?"good":tot>=5?"warn":"bad"})">${tot}<span style="font-size:14px;color:var(--muted)">/10</span></span></div>
   ${sc.map((a,i)=>`<div style="margin-top:12px"><div class="sub" style="margin-bottom:4px">Câu ${i+1} · ${esc(a.q.slice(0,60))}…</div><div class="star">${["S","T","A","R"].map(k=>`<div><b>${a.star[k]}</b><small>${{S:"Situation",T:"Task",A:"Action",R:"Result"}[k]}</small></div>`).join("")}</div></div>`).join("")}
   <p class="sub" style="margin-top:12px">Rule-based: độ dài, từ ngữ bối cảnh/mục tiêu, từ khóa kỹ thuật, con số kết quả.</p></div>
   <div class="card"><h2>Skill yếu → đề xuất</h2><div class="chips" style="margin:8px 0">${iv.weak.map(s=>`<span class="chip gap">${SKILLS[s]}</span>`).join("")||"<span class='sub'>Không phát hiện skill yếu</span>"}</div><p class="sub">${iv.nSug} đề xuất đã đẩy vào hộp đề xuất ở <a href="#/candidate/roadmap">Roadmap</a>.</p></div></div></div>`}
 return top+`<div class="card" style="max-width:760px"><div class="row between"><h2>${esc(iv.target)}</h2><span class="row"><span class="badge">${iv.diff}</span><span class="badge teal">Câu ${Math.min(iv.qi+1,3)}/3${iv.fu?" · follow-up":""}</span></span></div>${chat}
  <div class="divider"></div><textarea class="textarea" id="ivAns" placeholder="Trả lời theo STAR: tình huống → nhiệm vụ → hành động → kết quả…" style="min-height:80px"></textarea><div id="ivMic" class="sub" style="min-height:18px;margin-top:4px"></div>
  <div class="row" style="margin-top:8px"><button class="btn primary" data-a="ivSend">Gửi câu trả lời</button><button class="btn" data-a="ivMic">🎤 Nói (STT mock)</button><button class="btn" data-a="ivTTS">🔈 Nghe câu hỏi</button><button class="btn ghost" data-a="ivEnd">Kết thúc</button></div></div>`};
MOUNT["candidate/interview"]=()=>{const c=$("#ivChat");if(c)c.scrollTop=c.scrollHeight};
ACT.ivStart=()=>{const v=$("#ivTarget").value;const diff=$("#ivDiff").value;let career,target,gap=[];if(v.startsWith("jd:")){const j=S.jds.find(x=>x.id===v.slice(3));career=j.career;target=j.title+" · "+j.company;gap=matchJD(j).gap}else{const r=S.rooms.find(x=>x.id===v.slice(5));career=r.career;target=r.name;const p=roomProf(r);gap=Object.keys(p).filter(s=>p[s]<60)}
 const qs=INTERVIEW_QS[career];S.iv={career,target,diff,gap,qi:0,fu:false,msgs:[{who:"ai",text:`Chào bạn, tôi là người phỏng vấn cho vị trí ${target}. Chúng ta có 3 câu hỏi. ${qs[0].q}`}],answers:[]};log(`Bắt đầu mock interview: ${target} (${diff})`,900);route()};
ACT.ivSend=()=>{const iv=S.iv;const a=$("#ivAns").value.trim();if(!a)return;const qs=INTERVIEW_QS[iv.career];iv.msgs.push({who:"me",text:a});
 if(iv.fu){iv.answers[iv.answers.length-1].a+=" "+a;iv.fu=false}else iv.answers.push({q:qs[iv.qi].q,a});
 const cur=iv.answers[iv.answers.length-1];
 if(a.length<60&&!iv.fuUsed){iv.fu=true;iv.fuUsed=true;iv.msgs.push({who:"ai",text:"Bạn có thể nói cụ thể hơn không? Tình huống đó là gì, bạn đã làm gì và kết quả đo được ra sao?"});log("AI follow-up",700)}
 else{cur.star=starScore(cur.a,qs[iv.qi].kw,iv.diff);iv.qi++;if(iv.qi<3)iv.msgs.push({who:"ai",text:qs[iv.qi].q});else ivFinish(iv)}
 save();route()};
function ivFinish(iv){iv.done=true;const sum=iv.answers.reduce((t,a)=>t+a.star.S+a.star.T+a.star.A+a.star.R,0);iv.score=+(sum/(iv.answers.length*20)*10).toFixed(1);
 const c=careerOf(iv.career);const worst=iv.answers.map((a,i)=>({i,t:a.star.S+a.star.T+a.star.A+a.star.R})).sort((x,y)=>x.t-y.t)[0].i;iv.weak=[...new Set([...(iv.gap.slice(0,2)),c.skills[worst]])].slice(0,3);
 iv.nSug=suggestFromGap(room().id,iv.weak,"interview",`Mock interview ${iv.target} (${iv.score}/10)`);iv.msgs.push({who:"ai",text:`Cảm ơn bạn. Buổi phỏng vấn kết thúc. Điểm tổng ${iv.score}/10. Xem scorecard bên phải.`});
 S.interviews.push({date:today(),target:iv.target,diff:iv.diff,score:iv.score,weak:iv.weak});log(`Mock interview ${iv.target} – điểm ${iv.score}`,6900);if(iv.nSug)toast(`Đã tạo ${iv.nSug} đề xuất cải thiện lộ trình từ skill yếu`)}
ACT.ivEnd=()=>{S.iv=null;route()};
ACT.ivMic=()=>{const iv=S.iv;const m=$("#ivMic");m.textContent="Đang nghe… (STT tiếng Việt mock)";setTimeout(()=>{const list=SAMPLE_ANS[iv.career]||SAMPLE_ANS.fe;$("#ivAns").value=list[Math.min(iv.qi,2)];m.textContent="Đã chuyển giọng nói thành văn bản (mock).";log("STT mock: nhận câu trả lời",350)},1500)};
ACT.ivTTS=()=>{const iv=S.iv;const last=iv.msgs.filter(m=>m.who==="ai").pop();try{if(!("speechSynthesis" in window))throw 0;const u=new SpeechSynthesisUtterance(last.text);u.lang="vi-VN";speechSynthesis.cancel();speechSynthesis.speak(u);toast("Đang đọc câu hỏi (TTS trình duyệt, mock)")}catch(e){toast("Trình duyệt không hỗ trợ TTS – mock bỏ qua")}log("TTS mock: đọc câu hỏi",200)};

function aiReply(q){const t=q.toLowerCase();const r=room();const p=roomProf(r);const gap=Object.keys(p).filter(s=>p[s]<60);const rm=S.roadmap[r.id]||[];const nxt=rm.find(x=>x.status!=="done");

 if(/cv|hồ sơ/.test(t)){const e=cvEval();return `CV hiện ${e.score}/100. ${e.tips[0]||"Không có gợi ý lớn."}${e.tips[1]?" "+e.tips[1]:""}`}
 if(/việc|job|jd|match|ứng tuyển/.test(t)){const b=S.jds.map(j=>({j,m:matchJD(j)})).sort((a,b)=>b.m.pct-a.m.pct)[0];return `Hợp nhất lúc này: "${b.j.title}" tại ${b.j.company} – match ${b.m.pct}%. Thiếu: ${b.m.gap.map(s=>SKILLS[s]).join(", ")||"không"}. Vào Việc làm để tạo đề xuất cải thiện từ gap.`}
 if(/phỏng vấn|interview|star/.test(t)){const h=S.interviews.slice(-1)[0];return h?`Buổi mock gần nhất (${h.target}) được ${h.score}/10, yếu ở ${h.weak.map(s=>SKILLS[s]).join(", ")}. Luyện thêm phần Result: nêu con số đo được.`:`Bạn chưa mock interview. Chọn JD mục tiêu, độ khó Trung bình, trả lời theo STAR – tôi chấm từng câu.`;}
 if(/flashcard|thẻ|ôn/.test(t)){const td=today();const n=FLASHCARDS.filter(f=>careerOf(r.career).skills.includes(f.s)&&(!S.sm2[f.id]||S.sm2[f.id].due<=td)).length;return `Hôm nay có ${n} thẻ đến hạn ở ${r.name}. Ôn đều mỗi ngày, SM-2 sẽ giãn dần khoảng cách.`}
 if(/elo|điểm|năng lực|skill/.test(t))return `Proficiency ở ${r.name}: ${Object.keys(p).map(s=>`${SKILLS[s]} ${p[s]}`).join(", ")}.`;
 return `Tôi là trợ lý riêng của bạn ở ${r.name}. Hỏi tôi về roadmap, CV, việc làm, phỏng vấn hoặc flashcard. (Demo: câu trả lời đóng gói theo từ khóa.)`}
